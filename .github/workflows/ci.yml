name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The go.mod minimum plus the two releases upstream supports. Dropping
        # the minimum is how a library silently stops building for the
        # version its go.mod advertises.
        go: ['1.25.x', 'oldstable', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Verify go.mod
        if: matrix.go == 'stable'
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Build (CGO off, the whole point of this project)
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Test
        run: go test -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # .golangci.yml lints with the interop build tag, and that package is
      # cgo against libzmq, so the linter's typecheck needs the headers too.
      - name: Install libzmq
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev
      # Action v7+ is required for a v2 .golangci.yml; the linter is pinned to
      # the version the release was gated with.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Dead code
        run: test -z "$(go run golang.org/x/tools/cmd/deadcode@latest -test ./... | tee /dev/stderr)"

  race-coverage:
    name: race + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test with the race detector and coverage
        # One run serves both: the whole module under -race, with a coverage
        # profile over the library packages (examples/, perf/ and soak are
        # programs and harnesses with no tests by design).
        run: |
          set -euo pipefail
          pkgs=$(go list ./... | grep -v -e '/examples/' -e '/perf/' -e '/soak$')
          go test -race -count=1 -coverprofile=cover.out -covermode=atomic $pkgs
          go test -race -count=1 ./perf/...
      - name: Enforce minimum coverage
        env:
          MIN_COVERAGE: '80'
        run: |
          set -euo pipefail
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "library coverage: ${total}% (minimum ${MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit (t+0 >= m+0) ? 0 : 1 }' \
            || { echo "::error::coverage ${total}% is below the ${MIN_COVERAGE}% minimum"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  cross-build:
    name: cross-build (pure Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Cross-build
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          for target in linux/386 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
            echo "::group::$target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
            echo "::endgroup::"
          done

  fuzz-smoke:
    name: fuzz smoke (10s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: .github/fuzz.sh 10s

  interop:
    name: interop (libzmq, build-tagged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install libzmq
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev
      - run: go test -tags interop -race -count=1 ./interop/...
