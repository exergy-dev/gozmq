name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The go.mod minimum plus the two Go releases upstream supports.
        # Dropping the minimum from this matrix is how a library silently
        # stops building for the version its go.mod advertises.
        go: ['1.22.x', 'oldstable', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Verify go.mod
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Build (CGO off — the whole point of this project)
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Test
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  race:
    name: race (whole module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test with race detector
        env:
          CGO_ENABLED: '1'
        # ./... rather than a hand-listed set, so a new package is covered
        # the moment it exists.
        run: go test -race -count=1 ./...

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test with coverage
        run: go test -count=1 -coverprofile=cover.out -covermode=atomic ./...
      - name: Enforce minimum total coverage
        env:
          MIN_COVERAGE: '80'
        run: |
          set -euo pipefail
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}% (minimum ${MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit (t+0 >= m+0) ? 0 : 1 }' \
            || { echo "::error::coverage ${total}% is below the ${MIN_COVERAGE}% minimum"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  cross-build:
    name: cross-build (pure Go)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: '386'
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: freebsd
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Cross-build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  fuzz-smoke:
    name: fuzz smoke (10s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Fuzz smoke
        # Discover every Fuzz* target via go test -list and run each for 10s.
        # The nightly workflow runs the same targets for far longer.
        run: |
          set -euo pipefail
          pkgs=$(go list ./...)
          for pkg in $pkgs; do
            targets=$(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true)
            for t in $targets; do
              echo "::group::$pkg $t"
              go test -run '^$' -fuzz "^${t}$" -fuzztime=10s "$pkg"
              echo "::endgroup::"
            done
          done

  interop:
    name: interop (libzmq, build-tagged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install libzmq (for the CGO interop harness)
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev
      - name: Run interop tests
        env:
          CGO_ENABLED: '1'
        run: go test -tags interop -race -count=1 ./interop/...
