name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Verify go.mod
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Build (CGO off — the whole point of this project)
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Test
        env:
          CGO_ENABLED: '1'
        run: go test -count=1 ./...

  race:
    name: race (core packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test with race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 . ./internal/session ./internal/socket ./internal/pipe ./internal/msg ./internal/stream ./transport ./internal/zmtp ./security ./security/curve ./typed ./typed/codecjson

  cross-build:
    name: cross-build (pure Go)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: '386'
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Cross-build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  fuzz-smoke:
    name: fuzz smoke (10s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Fuzz smoke
        # Discover every Fuzz* target via go test -list and run each for 10s.
        run: |
          set -euo pipefail
          pkgs=$(go list ./...)
          for pkg in $pkgs; do
            targets=$(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true)
            for t in $targets; do
              echo "::group::$pkg $t"
              go test -run '^$' -fuzz "^${t}$" -fuzztime=10s "$pkg"
              echo "::endgroup::"
            done
          done

  interop:
    name: interop (libzmq, build-tagged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Install libzmq (for the CGO interop harness)
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev
      - name: Run interop tests
        env:
          CGO_ENABLED: '1'
        run: |
          if [ -d interop ] && find interop -name '*_test.go' -print -quit | grep -q .; then
            go test -tags interop -race ./interop/...
          else
            echo "interop test bodies not yet present (pre-Wave-1-A7) — skipping"
          fi
