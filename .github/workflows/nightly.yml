name: nightly

# The PR-path checks finish in minutes, so they only scratch the fuzz targets
# and run each test once. The slow, flake-hunting, long-horizon checks live here.

on:
  schedule:
    - cron: '20 4 * * *'   # 04:20 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (10m per target)
    runs-on: ubuntu-latest
    # Every Fuzz* target gets the fuzztime below; fourteen targets at 10m is
    # 140 minutes plus a build each, so the budget has to clear that.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: .github/fuzz.sh 10m
      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: |
            **/testdata/fuzz/**
            ~/.cache/go-build/fuzz/**

  flake-hunt:
    name: repeated race runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Concurrency bugs in a networking library surface as rare flakes; five
      # race-enabled passes catch most of what a single run hides.
      - run: go test -race -count=5 -timeout 60m ./...

  soak:
    name: soak (connection churn)
    runs-on: ubuntu-latest
    # Three soak tests run one after another, each for GOZMQ_SOAK_DURATION.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - env:
          GOZMQ_SOAK_DURATION: 10m
        run: go test -tags soak -run TestSoak -timeout 60m -v ./soak/...

  interop:
    name: interop, repeated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y libzmq3-dev
      - run: go test -tags interop -race -count=3 ./interop/...
