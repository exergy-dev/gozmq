version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    ignore:
      # x/crypto 0.53+ requires Go 1.26; the module floor is Go 1.25.
      # Lift this when the floor moves.
      - dependency-name: "golang.org/x/crypto"
        versions: [">=0.53.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
